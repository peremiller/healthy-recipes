<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>NourishPlan — Healthy Recipes & Meal Planner</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<style>
:root{
  --bg:#f4f7f4;
  --card:#ffffff;
  --ink:#161d17;
  --muted:#6b7671;
  --line:#e2e8e3;
  --brand:#16a34a;
  --brand-ink:#ffffff;
  --brand-soft:#dcf3e4;
  --amber:#d97706;
  --amber-soft:#fef3c7;
  --danger:#dc2626;
  --shadow:0 1px 3px rgba(0,0,0,.08), 0 1px 2px rgba(0,0,0,.04);
  --radius:14px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d120e;
    --card:#161c17;
    --ink:#e6ece7;
    --muted:#95a19a;
    --line:#26302a;
    --brand:#22c55e;
    --brand-ink:#06230f;
    --brand-soft:#123420;
    --amber:#f59e0b;
    --amber-soft:#3a2c0a;
    --danger:#f87171;
    --shadow:0 1px 3px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 16px 8px;
  font-weight:800;font-size:19px;}
.topbar-logo{width:34px;height:34px;border-radius:9px;display:block;}
.topbar .spacer{flex:1}
.tabs{display:flex;gap:6px;padding:6px 16px 10px;overflow-x:auto;
  position:sticky;top:0;background:var(--bg);z-index:20;}
.tab{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:8px 14px;font-weight:600;font-size:13.5px;
  cursor:pointer;white-space:nowrap;}
.tab.on{background:var(--brand);border-color:var(--brand);color:var(--brand-ink);}
.screen{padding:4px 16px 110px;max-width:760px;margin:0 auto;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  box-shadow:var(--shadow);padding:14px;margin-bottom:10px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.name{font-weight:700}
.btn{background:var(--brand);color:var(--brand-ink);border:0;border-radius:10px;
  padding:10px 14px;font-weight:700;cursor:pointer;font-size:14px;}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand);}
.btn.subtle{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600;}
.btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px;}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.icon{background:0;border:0;color:var(--muted);cursor:pointer;font-size:16px;
  padding:6px;border-radius:8px;min-width:32px;}
.icon:hover{background:var(--brand-soft);color:var(--brand);}
.pill{display:inline-block;background:var(--brand-soft);color:var(--brand);
  border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:700;}
.pill.amber{background:var(--amber-soft);color:var(--amber);}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 10px;}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);
  border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;white-space:nowrap;}
.chip.on{background:var(--brand-soft);border-color:var(--brand);color:var(--brand);}
.search{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:11px;
  background:var(--card);color:var(--ink);font-size:14px;margin:2px 0 10px;}
.search:focus{outline:2px solid var(--brand);border-color:var(--brand);}
.empty{text-align:center;padding:32px 12px;}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px;}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:10px 12px;text-align:center;}
.stat b{display:block;font-size:19px;color:var(--brand);}
.stat span{font-size:11.5px;color:var(--muted);}
/* Planner */
.seg{display:flex;background:var(--card);border:1px solid var(--line);
  border-radius:11px;padding:3px;gap:3px;}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);
  padding:8px 0;border-radius:8px;font-weight:700;font-size:13.5px;cursor:pointer;}
.seg button.on{background:var(--brand);color:var(--brand-ink);}
.wknav{display:flex;align-items:center;justify-content:space-between;
  gap:8px;margin:12px 0 10px;}
.wknav .title{font-weight:800;font-size:15.5px;}
.daycard{padding:0;overflow:hidden;}
.dayhead{display:flex;align-items:center;justify-content:space-between;
  padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg);}
.daycard.today .dayhead{background:var(--brand-soft);}
.dayhead .dn{font-weight:800;font-size:14px;}
.slots{padding:6px 10px 10px;}
.slotrow{display:flex;align-items:center;gap:8px;padding:5px 0;}
.slotlabel{width:74px;flex:none;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.4px;}
.slotbtn{flex:1;text-align:left;border:1px dashed var(--line);background:transparent;
  color:var(--muted);border-radius:9px;padding:8px 10px;font-size:13.5px;cursor:pointer;
  min-height:38px;}
.slotbtn.filled{border-style:solid;background:var(--bg);color:var(--ink);font-weight:600;}
.slotbtn .cal{color:var(--muted);font-weight:500;font-size:12px;}
.mealcard h4{margin:0 0 2px;font-size:12px;text-transform:uppercase;
  letter-spacing:.5px;color:var(--muted);}
.mealcard .rname{font-weight:800;font-size:16.5px;margin:2px 0 4px;}
.mealbtns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
/* Grocery */
.gitem{display:flex;align-items:center;gap:11px;padding:11px 14px;
  border-bottom:1px solid var(--line);}
.gitem:last-child{border-bottom:0}
.gitem input[type=checkbox]{width:19px;height:19px;accent-color:var(--brand);flex:none;}
.gitem.done .gname{text-decoration:line-through;color:var(--muted);}
.gname{font-weight:600;flex:1}
.gqty{font-size:12.5px;color:var(--muted);text-align:right;}
.gqty b{color:var(--amber);font-size:13.5px;}
.listcard{padding:0;overflow:hidden;}
.listhead{padding:10px 14px;border-bottom:1px solid var(--line);
  font-weight:800;font-size:13.5px;background:var(--bg);
  display:flex;justify-content:space-between;align-items:center;}
/* Inventory */
.qtyctl{display:flex;align-items:center;gap:2px;}
.qtyctl button{border:1px solid var(--line);background:var(--card);color:var(--ink);
  width:30px;height:30px;border-radius:8px;cursor:pointer;font-weight:800;font-size:15px;}
.qtyctl .q{min-width:64px;text-align:center;font-weight:700;font-size:13.5px;}
/* Recipe detail */
.detailhero{border-left:4px solid var(--brand);}
.ingline{display:flex;justify-content:space-between;padding:7px 0;
  border-bottom:1px dashed var(--line);font-size:14px;}
.ingline:last-child{border-bottom:0}
.steps{margin:0;padding-left:20px;}
.steps li{margin:8px 0;}
/* Modal */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.modal{width:100%;max-width:500px;background:var(--card);border:1px solid var(--line);
  border-radius:18px 18px 0 0;max-height:88vh;overflow:auto;position:relative;
  padding:18px 16px 22px;}
@media(min-width:540px){.backdrop{align-items:center}.modal{border-radius:18px}}
.modal h3{margin:0 30px 12px 0;}
.modal label{display:block;margin:10px 0;font-size:12.5px;font-weight:600;color:var(--muted);}
.modal input,.modal select,.modal textarea{width:100%;margin-top:4px;padding:10px;
  border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);
  font:inherit;font-size:14px;}
.modal textarea{min-height:88px;resize:vertical;}
.icon.close{position:absolute;top:10px;right:10px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.pickrow{display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:11px 4px;border-bottom:1px solid var(--line);cursor:pointer;}
.pickrow:hover{background:var(--brand-soft);}
/* FAB + toast */
.fab{position:fixed;right:16px;bottom:18px;z-index:40;border:0;cursor:pointer;
  background:var(--brand);color:var(--brand-ink);font-weight:800;border-radius:999px;
  padding:15px 20px;font-size:14.5px;box-shadow:0 4px 14px rgba(0,0,0,.22);}
.toast{position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(10px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;
  font-size:13px;opacity:0;transition:.25s;z-index:60;pointer-events:none;}
.toast.show{opacity:.96;transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div id="app"></div>
<button id="fab" class="fab">+</button>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
"use strict";
/* ---------------- helpers ---------------- */
const $  = (s,r=document)=> r.querySelector(s);
const $$ = (s,r=document)=> Array.from(r.querySelectorAll(s));
const uid = ()=> Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = ()=> isoOf(new Date());
const fmtDate = iso => new Date(iso+"T00:00:00")
  .toLocaleDateString(undefined,{month:"short",day:"numeric"});
const fmtDow = iso => new Date(iso+"T00:00:00")
  .toLocaleDateString(undefined,{weekday:"short"});
const fmtLong = iso => new Date(iso+"T00:00:00")
  .toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
const round1 = n => Math.round(n*100)/100;

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("#toastRoot").appendChild(el);
  requestAnimationFrame(()=> el.classList.add("show"));
  setTimeout(()=>{ el.classList.remove("show"); setTimeout(()=> el.remove(),250); },2200);
}

/* week starting Monday */
function mondayOf(date){
  const x = new Date(date); x.setHours(0,0,0,0);
  x.setDate(x.getDate() - ((x.getDay()+6)%7));
  return x;
}
function weekDates(offset){
  const m = mondayOf(new Date()); m.setDate(m.getDate()+offset*7);
  return Array.from({length:7},(_,i)=>{ const d=new Date(m); d.setDate(d.getDate()+i); return isoOf(d); });
}

/* ingredient name/unit normalization for matching plan vs inventory */
const UNIT_ALIAS = {cups:"cup",tbsps:"tbsp",tablespoon:"tbsp",tablespoons:"tbsp",
  teaspoon:"tsp",teaspoons:"tsp",tsps:"tsp",grams:"g",gram:"g",kilogram:"kg",
  pieces:"pc",piece:"pc",pcs:"pc",cans:"can",cloves:"clove",slices:"slice",
  heads:"head",bunches:"bunch",liters:"l",liter:"l"};
const KNOWN_UNITS = ["g","kg","ml","l","cup","tbsp","tsp","oz","lb","pc","can",
  "clove","slice","bunch","head"].concat(Object.keys(UNIT_ALIAS));
const normUnit = u => { u=(u||"").trim().toLowerCase(); return UNIT_ALIAS[u]||u; };
const normName = s => String(s||"").trim().toLowerCase().replace(/s$/,"");
const keyOf = (name,unit)=> normName(name)+"|"+normUnit(unit);

/* parse "1.5 cup rolled oats" | "2 eggs" | "salt" */
function parseIngLine(line){
  const t = line.trim(); if(!t) return null;
  const m = t.match(/^(\d+(?:\.\d+)?|\d+\/\d+)\s+(.+)$/);
  if(!m) return {qty:1, unit:"", name:t};
  let qty = m[1].includes("/") ? (n=>n[0]/n[1])(m[1].split("/").map(Number)) : Number(m[1]);
  const rest = m[2].trim(); const sp = rest.indexOf(" ");
  if(sp>0){
    const first = rest.slice(0,sp).toLowerCase();
    if(KNOWN_UNITS.includes(first))
      return {qty, unit:normUnit(first), name:rest.slice(sp+1).trim()};
  }
  return {qty, unit:"", name:rest};
}
const ingToLine = i => `${i.qty} ${i.unit?i.unit+" ":""}${i.name}`.trim();

/* ---------------- seed ---------------- */
const MEALS = ["breakfast","lunch","dinner","snack"];
const MEAL_LABEL = {breakfast:"Breakfast",lunch:"Lunch",dinner:"Dinner",snack:"Snack"};
const CATS = ["breakfast","lunch","dinner","snack"];

function R(name,cat,cal,time,tags,ings,steps){
  return { id:uid(), name, cat, cal, time, tags,
    ingredients: ings.map(([qty,unit,n])=>({qty,unit,name:n})), steps };
}
function seed(){
  const recipes = [
    R("Overnight Oats with Berries","breakfast",320,5,["high-fiber","make-ahead"],
      [[0.5,"cup","rolled oats"],[0.75,"cup","almond milk"],[1,"tbsp","chia seeds"],
       [0.5,"cup","mixed berries"],[1,"tsp","honey"]],
      ["Combine oats, milk, chia seeds and honey in a jar.",
       "Refrigerate overnight (at least 4 hours).",
       "Top with berries before serving."]),
    R("Veggie Egg Scramble","breakfast",290,15,["high-protein","vegetarian"],
      [[3,"","egg"],[0.5,"cup","spinach"],[0.25,"cup","bell pepper"],
       [0.25,"cup","onion"],[1,"tsp","olive oil"]],
      ["Sauté onion and pepper in olive oil 3 min.",
       "Add spinach until wilted.","Add beaten eggs, scramble until just set."]),
    R("Greek Yogurt Parfait","breakfast",280,5,["high-protein","quick"],
      [[1,"cup","greek yogurt"],[0.25,"cup","granola"],
       [0.5,"cup","mixed berries"],[1,"tsp","honey"]],
      ["Layer yogurt, granola and berries in a glass.","Drizzle with honey."]),
    R("Quinoa Chickpea Salad","lunch",420,20,["vegan","meal-prep"],
      [[0.75,"cup","quinoa"],[1,"can","chickpeas"],[1,"cup","cucumber"],
       [1,"cup","cherry tomatoes"],[2,"tbsp","olive oil"],[1,"tbsp","lemon juice"],
       [0.25,"cup","feta cheese"]],
      ["Cook quinoa and let cool.","Chop cucumber and halve tomatoes.",
       "Toss everything with olive oil and lemon juice."]),
    R("Grilled Chicken Wrap","lunch",450,20,["high-protein"],
      [[150,"g","chicken breast"],[1,"pc","whole-wheat tortilla"],
       [0.5,"cup","lettuce"],[0.25,"cup","tomato"],[2,"tbsp","greek yogurt"],
       [1,"tsp","olive oil"]],
      ["Season and grill chicken 5–6 min per side; slice.",
       "Spread yogurt on tortilla, add lettuce, tomato and chicken.","Roll tightly and halve."]),
    R("Hearty Lentil Soup","lunch",380,35,["vegan","high-fiber","batch-cook"],
      [[1,"cup","red lentils"],[1,"pc","carrot"],[1,"pc","celery stalk"],
       [0.5,"cup","onion"],[2,"clove","garlic"],[4,"cup","vegetable broth"],
       [1,"tbsp","olive oil"],[1,"tsp","cumin"]],
      ["Sauté onion, carrot, celery and garlic in oil.",
       "Add lentils, cumin and broth; simmer 25 min.","Season and serve."]),
    R("Baked Salmon & Roasted Veggies","dinner",520,30,["omega-3","high-protein"],
      [[180,"g","salmon fillet"],[1,"cup","broccoli"],[1,"pc","zucchini"],
       [1,"cup","sweet potato"],[2,"tbsp","olive oil"],[1,"pc","lemon"]],
      ["Toss veggies with oil; roast at 200°C for 15 min.",
       "Add salmon, squeeze lemon over; bake 12–14 min more."]),
    R("Tofu Stir-Fry with Brown Rice","dinner",470,25,["vegan","high-protein"],
      [[200,"g","firm tofu"],[0.75,"cup","brown rice"],[1,"cup","broccoli"],
       [0.5,"cup","bell pepper"],[2,"tbsp","soy sauce"],[1,"tbsp","sesame oil"],
       [1,"clove","garlic"],[1,"tsp","ginger"]],
      ["Cook brown rice.","Pan-fry cubed tofu until golden.",
       "Stir-fry veggies with garlic and ginger; add tofu and soy sauce.","Serve over rice."]),
    R("Turkey & Bean Chili","dinner",480,40,["high-protein","batch-cook"],
      [[300,"g","ground turkey"],[1,"can","kidney beans"],[1,"can","diced tomatoes"],
       [0.5,"cup","onion"],[2,"clove","garlic"],[1,"tbsp","chili powder"],
       [1,"tsp","cumin"],[1,"tbsp","olive oil"]],
      ["Brown turkey with onion and garlic in oil.",
       "Add spices, beans and tomatoes.","Simmer 25–30 min."]),
    R("Zucchini Noodles with Pesto","dinner",390,20,["low-carb","vegetarian"],
      [[2,"pc","zucchini"],[3,"tbsp","pesto"],[1,"cup","cherry tomatoes"],
       [2,"tbsp","parmesan"],[1,"tbsp","pine nuts"],[1,"tsp","olive oil"]],
      ["Spiralize zucchini into noodles.","Sauté 2 min in olive oil.",
       "Toss with pesto and tomatoes; top with parmesan and pine nuts."]),
    R("Hummus & Veggie Sticks","snack",180,5,["vegan","quick"],
      [[0.33,"cup","hummus"],[1,"pc","carrot"],[1,"pc","celery stalk"],
       [0.5,"cup","bell pepper"]],
      ["Cut veggies into sticks.","Serve with hummus."]),
    R("Apple with Peanut Butter","snack",210,2,["quick"],
      [[1,"pc","apple"],[2,"tbsp","peanut butter"]],
      ["Slice apple.","Serve with peanut butter for dipping."]),
  ];
  const byName = n => recipes.find(r=> r.name===n).id;
  const wk = weekDates(0);
  const plan = {};
  const menus = [
    ["Overnight Oats with Berries","Quinoa Chickpea Salad","Baked Salmon & Roasted Veggies","Apple with Peanut Butter"],
    ["Greek Yogurt Parfait","Hearty Lentil Soup","Tofu Stir-Fry with Brown Rice","Hummus & Veggie Sticks"],
    ["Veggie Egg Scramble","Grilled Chicken Wrap","Turkey & Bean Chili","Apple with Peanut Butter"],
    ["Overnight Oats with Berries","Hearty Lentil Soup","Zucchini Noodles with Pesto","Hummus & Veggie Sticks"],
    ["Greek Yogurt Parfait","Quinoa Chickpea Salad","Tofu Stir-Fry with Brown Rice",null],
  ];
  wk.forEach((d,i)=>{
    if(i < menus.length){
      const m = menus[i];
      plan[d] = { breakfast:byName(m[0]), lunch:byName(m[1]),
                  dinner:byName(m[2]), snack:m[3]?byName(m[3]):null };
    }
  });
  const inventory = [
    {id:uid(), name:"rolled oats",   qty:3,  unit:"cup"},
    {id:uid(), name:"greek yogurt",  qty:2,  unit:"cup"},
    {id:uid(), name:"olive oil",     qty:16, unit:"tbsp"},
    {id:uid(), name:"brown rice",    qty:2,  unit:"cup"},
    {id:uid(), name:"egg",           qty:6,  unit:""},
    {id:uid(), name:"quinoa",        qty:1,  unit:"cup"},
    {id:uid(), name:"honey",         qty:10, unit:"tsp"},
    {id:uid(), name:"soy sauce",     qty:8,  unit:"tbsp"},
  ];
  return { seeded:true, recipes, plan, inventory, extras:[], checked:{} };
}

/* ---------------- storage ---------------- */
const LS = "nourishplan.v1";
function normalize(s){
  s = s || {};
  s.recipes   = Array.isArray(s.recipes)   ? s.recipes   : [];
  s.inventory = Array.isArray(s.inventory) ? s.inventory : [];
  s.extras    = Array.isArray(s.extras)    ? s.extras    : [];
  s.plan      = (s.plan && typeof s.plan==="object") ? s.plan : {};
  s.checked   = (s.checked && typeof s.checked==="object") ? s.checked : {};
  s.recipes.forEach(r=>{
    r.ingredients = Array.isArray(r.ingredients) ? r.ingredients : [];
    r.steps = Array.isArray(r.steps) ? r.steps : [];
    r.tags = Array.isArray(r.tags) ? r.tags : [];
    r.cat = r.cat || "dinner";
  });
  return s;
}
function boot(){
  try{ const raw = localStorage.getItem(LS); if(raw) return normalize(JSON.parse(raw)); }
  catch(e){}
  return normalize(seed());
}
let state = boot();
localStorage.setItem(LS, JSON.stringify(state));
function save(){ localStorage.setItem(LS, JSON.stringify(state)); }

/* ---------------- UI state ---------------- */
let view = "planner";
let workspace = null;          // {id} — recipe detail
let plannerMode = "week";      // "week" | "day"
let weekOffset = 0;
let dayDate = todayISO();
let recipeQuery = "", recipeCat = "all";

const recipeById = id => state.recipes.find(r=> r.id===id) || null;
const planFor = d => state.plan[d] || {};

/* ---------------- grocery math ---------------- */
function weekNeeds(dates){
  const map = {};
  dates.forEach(d=>{
    const day = planFor(d);
    MEALS.forEach(m=>{
      const r = recipeById(day[m]); if(!r) return;
      r.ingredients.forEach(ing=>{
        const k = keyOf(ing.name, ing.unit);
        if(!map[k]) map[k] = {name:ing.name, unit:normUnit(ing.unit), need:0};
        map[k].need += Number(ing.qty)||0;
      });
    });
  });
  return map;
}
function inventoryByKey(){
  const map = {};
  state.inventory.forEach(it=>{
    const k = keyOf(it.name, it.unit);
    map[k] = (map[k]||0) + (Number(it.qty)||0);
  });
  return map;
}
function groceryData(){
  const dates = weekDates(weekOffset);
  const needs = weekNeeds(dates);
  const have = inventoryByKey();
  const toBuy = [], covered = [];
  Object.keys(needs).sort((a,b)=> needs[a].name.localeCompare(needs[b].name)).forEach(k=>{
    const n = needs[k];
    const h = have[k]||0;
    const buy = round1(Math.max(0, n.need - h));
    const row = {key:k, name:n.name, unit:n.unit, need:round1(n.need), have:round1(Math.min(h,n.need)), buy};
    (buy>0 ? toBuy : covered).push(row);
  });
  return {dates, toBuy, covered};
}

/* ---------------- render ---------------- */
const TABS = [
  {k:"planner", label:"🗓️ Planner"},
  {k:"recipes", label:"🥗 Recipes"},
  {k:"inventory", label:"🧺 Inventory"},
  {k:"grocery", label:"🛒 Grocery"},
];

function render(){
  const app = $("#app");
  if(workspace){
    app.innerHTML = renderRecipeDetail(workspace.id);
  }else{
    app.innerHTML = `
      <header class="topbar"><img class="topbar-logo" src="favicon.svg" alt="" aria-hidden="true"> NourishPlan
        <span class="spacer"></span>
        <button class="icon" id="menuBtn" aria-label="Menu" title="Backup & settings">⋯</button>
      </header>
      <nav class="tabs">
        ${TABS.map(t=>`<button class="tab ${view===t.k?'on':''}" data-tab="${t.k}">${t.label}</button>`).join("")}
      </nav>
      <main class="screen">${renderTab()}</main>`;
  }
  wire();
  renderFab();
}
function renderTab(){
  if(view==="planner")   return renderPlanner();
  if(view==="recipes")   return renderRecipes();
  if(view==="inventory") return renderInventory();
  if(view==="grocery")   return renderGrocery();
  return "";
}

/* ---- planner ---- */
function dayCalories(d){
  return MEALS.reduce((s,m)=>{ const r=recipeById(planFor(d)[m]); return s+(r?r.cal:0); },0);
}
function renderPlanner(){
  const seg = `
    <div class="seg">
      <button class="${plannerMode==='week'?'on':''}" data-mode="week">Week</button>
      <button class="${plannerMode==='day'?'on':''}" data-mode="day">Day</button>
    </div>`;
  return seg + (plannerMode==="week" ? renderWeek() : renderDay());
}
function renderWeek(){
  const dates = weekDates(weekOffset);
  const planned = dates.reduce((s,d)=> s + MEALS.filter(m=> planFor(d)[m]).length, 0);
  const calDays = dates.filter(d=> dayCalories(d)>0);
  const avgCal = calDays.length ? Math.round(calDays.reduce((s,d)=> s+dayCalories(d),0)/calDays.length) : 0;
  const today = todayISO();
  return `
    <div class="wknav">
      <button class="btn subtle sm" data-wk="-1">‹ Prev</button>
      <div class="title">${fmtDate(dates[0])} – ${fmtDate(dates[6])}
        ${weekOffset===0?'<span class="pill">this week</span>':''}</div>
      <button class="btn subtle sm" data-wk="1">Next ›</button>
    </div>
    ${weekOffset!==0?`<div style="text-align:center;margin-bottom:10px">
      <button class="btn ghost sm" data-wk="0">Back to this week</button></div>`:""}
    <div class="statrow">
      <div class="stat"><b>${planned}</b><span>meals planned</span></div>
      <div class="stat"><b>${28-planned}</b><span>slots open</span></div>
      <div class="stat"><b>${avgCal||"–"}</b><span>avg kcal / day</span></div>
    </div>
    ${dates.map(d=>{
      const cal = dayCalories(d);
      return `
      <div class="card daycard ${d===today?'today':''}">
        <div class="dayhead">
          <span class="dn">${fmtDow(d)} · ${fmtDate(d)} ${d===today?'<span class="pill">today</span>':''}</span>
          <span class="muted small">${cal?cal+" kcal":""}</span>
        </div>
        <div class="slots">
          ${MEALS.map(m=>{
            const r = recipeById(planFor(d)[m]);
            return `<div class="slotrow">
              <span class="slotlabel">${MEAL_LABEL[m]}</span>
              <button class="slotbtn ${r?'filled':''}" data-pick="${d}|${m}">
                ${r ? `${esc(r.name)} <span class="cal">· ${r.cal} kcal</span>` : "+ Add"}
              </button>
              ${r?`<button class="icon" data-clearslot="${d}|${m}" aria-label="Clear">✕</button>`:""}
            </div>`;
          }).join("")}
        </div>
      </div>`;
    }).join("")}`;
}
function renderDay(){
  const d = dayDate, today = todayISO();
  const cal = dayCalories(d);
  return `
    <div class="wknav">
      <button class="btn subtle sm" data-daynav="-1">‹</button>
      <div class="title">${fmtLong(d)} ${d===today?'<span class="pill">today</span>':''}</div>
      <button class="btn subtle sm" data-daynav="1">›</button>
    </div>
    ${d!==today?`<div style="text-align:center;margin-bottom:10px">
      <button class="btn ghost sm" data-daynav="0">Jump to today</button></div>`:""}
    <div class="statrow" style="grid-template-columns:repeat(2,1fr)">
      <div class="stat"><b>${MEALS.filter(m=>planFor(d)[m]).length}/4</b><span>meals planned</span></div>
      <div class="stat"><b>${cal||"–"}</b><span>kcal planned</span></div>
    </div>
    ${MEALS.map(m=>{
      const r = recipeById(planFor(d)[m]);
      if(!r) return `<div class="card mealcard">
        <h4>${MEAL_LABEL[m]}</h4>
        <button class="slotbtn" data-pick="${d}|${m}" style="margin-top:6px">+ Add a recipe</button>
      </div>`;
      return `<div class="card mealcard">
        <h4>${MEAL_LABEL[m]}</h4>
        <div class="rname">${esc(r.name)}</div>
        <div class="muted small">${r.cal} kcal · ${r.time} min · ${r.ingredients.length} ingredients</div>
        <div class="mealbtns">
          <button class="btn sm" data-open="${r.id}">View recipe</button>
          <button class="btn subtle sm" data-pick="${d}|${m}">Change</button>
          <button class="btn subtle sm" data-clearslot="${d}|${m}">Remove</button>
        </div>
      </div>`;
    }).join("")}`;
}

/* ---- recipes ---- */

  const list = state.recipes.filter(r=>
    (recipeCat==="all" || r.cat===recipeCat) &&
    (!q || r.name.toLowerCase().includes(q) ||
      r.tags.join(" ").toLowerCase().includes(q) ||
      r.ingredients.some(i=> i.name.toLowerCase().includes(q))));
  return `
    <input class="search" id="recipeSearch" placeholder="Search recipes, tags, ingredients…" value="${esc(recipeQuery)}">
    <div class="chips">
      ${["all",...CATS].map(c=>`<button class="chip ${recipeCat===c?'on':''}" data-cat="${c}">
        ${c==="all"?"All":MEAL_LABEL[c]}</button>`).join("")}
    </div>
    ${!list.length ? `<p class="muted empty">No recipes match. Tap + to add one.</p>` :
      list.map(r=>`
      <div class="card row" data-open="${r.id}" style="cursor:pointer">
        <div>
          <div class="name">${esc(r.name)}</div>
          <div class="muted small">${MEAL_LABEL[r.cat]} · ${r.cal} kcal · ${r.time} min</div>
          <div style="margin-top:5px">${r.tags.map(t=>`<span class="pill" style="margin-right:4px">${esc(t)}</span>`).join("")}</div>
        </div>

}

/* ---- inventory ---- */

  const items = [...state.inventory].sort((a,b)=> a.name.localeCompare(b.name));
  return `
    <p class="muted small" style="margin:4px 2px 12px">What you already have at home.
      The grocery list subtracts these from your planned week.</p>
    ${!items.length ? `<p class="muted empty">Inventory is empty. Tap + to add what you have.</p>` :
      items.map(it=>`
      <div class="card row">
        <div>
          <div class="name">${esc(it.name)}</div>
          <div class="muted small">${it.unit?esc(it.unit):"count"}</div>
        </div>
        <div class="qtyctl">
          <button data-invminus="${it.id}" aria-label="Less">−</button>
          <span class="q">${it.qty} ${esc(it.unit)}</span>
          <button data-invplus="${it.id}" aria-label="More">+</button>
          <button class="icon" data-invdel="${it.id}" aria-label="Delete">✕</button>
        </div>

}

/* ---- grocery ---- */
function renderGrocery(){
  const {dates, toBuy, covered} = groceryData();
  const extras = state.extras;
  const checkedCount = toBuy.filter(i=> state.checked[i.key]).length +
                       extras.filter(e=> state.checked["x:"+e.id]).length;
  const totalBuy = toBuy.length + extras.length;
  return `
    <div class="wknav">
      <button class="btn subtle sm" data-wk="-1">‹ Prev</button>
      <div class="title">Week of ${fmtDate(dates[0])} – ${fmtDate(dates[6])}
        ${weekOffset===0?'<span class="pill">this week</span>':''}</div>
      <button class="btn subtle sm" data-wk="1">Next ›</button>
    </div>
    <div class="statrow">
      <div class="stat"><b>${totalBuy}</b><span>to buy</span></div>
      <div class="stat"><b>${checkedCount}</b><span>in cart</span></div>
      <div class="stat"><b>${covered.length}</b><span>already stocked</span></div>
    </div>
    ${totalBuy===0 && covered.length===0 ?
      `<p class="muted empty">Nothing planned this week yet.<br>Add meals in the Planner to build your list.</p>` : `
    <div class="card listcard">
      <div class="listhead"><span>🛒 To buy</span>
        ${checkedCount?`<button class="btn sm" id="purchasedBtn">Move ${checkedCount} to inventory</button>`:""}
      </div>
      ${!totalBuy ? `<p class="muted" style="padding:14px">Everything you need is already in your inventory 🎉</p>` :
        toBuy.map(i=>`
        <label class="gitem ${state.checked[i.key]?'done':''}">
          <input type="checkbox" data-chk="${esc(i.key)}" ${state.checked[i.key]?"checked":""}>
          <span class="gname">${esc(i.name)}</span>
          <span class="gqty"><b>buy ${i.buy} ${esc(i.unit)}</b><br>need ${i.need} · have ${i.have}</span>
        </label>`).join("") +
        extras.map(e=>`
        <label class="gitem ${state.checked["x:"+e.id]?'done':''}">
          <input type="checkbox" data-chk="x:${e.id}" ${state.checked["x:"+e.id]?"checked":""}>
          <span class="gname">${esc(e.name)} <span class="pill amber">extra</span></span>
          <span class="gqty"><b>buy ${e.qty} ${esc(e.unit)}</b>
            <button class="icon" data-extradel="${e.id}" aria-label="Remove">✕</button></span>
        </label>`).join("")}
    </div>
    ${covered.length?`
    <div class="card listcard">
      <div class="listhead"><span>✅ Covered by inventory</span></div>
      ${covered.map(i=>`
        <div class="gitem">
          <span class="gname muted">${esc(i.name)}</span>
          <span class="gqty">need ${i.need} ${esc(i.unit)} · have it</span>
        </div>`).join("")}
    </div>`:""}`}`;
}

/* ---------------- FAB ---------------- */
function renderFab(){
  const fab = $("#fab");
  let action=null, label="+";
  if(workspace){ action=null; }
  else if(view==="recipes"){ action=()=>recipeModal(); label="+ Recipe"; }
  else if(view==="inventory"){ action=()=>inventoryModal(); label="+ Item"; }
  else if(view==="grocery"){ action=()=>extraModal(); label="+ Extra item"; }
  fab.textContent = label;
  fab.style.display = action ? "" : "none";
  fab.onclick = action;
}

/* ---------------- modals ---------------- */
function openModal(html){
  $("#modalRoot").innerHTML = `
    <div class="backdrop" id="mBack">
      <div class="modal" role="dialog" aria-modal="true">
        <button class="icon close" id="mClose" aria-label="Close">✕</button>
        ${html}
      </div>
    </div>`;
  $("#mBack").onclick = e=>{ if(e.target.id==="mBack") closeModal(); };
  $("#mClose").onclick = closeModal;
}
function closeModal(){ $("#modalRoot").innerHTML = ""; }

function recipeModal(existing){
  const r = existing || {};
  openModal(`
    <h3>${existing?"Edit":"New"} recipe</h3>
    <label>Name<input id="f-name" value="${esc(r.name||"")}" placeholder="e.g. Miso Salmon Bowl"></label>
    <div class="grid3">
      <label>Meal type<select id="f-cat">
        ${CATS.map(c=>`<option value="${c}" ${r.cat===c?"selected":""}>${MEAL_LABEL[c]}</option>`).join("")}
      </select></label>
      <label>Calories<input id="f-cal" type="number" min="0" value="${r.cal||""}" placeholder="450"></label>
      <label>Minutes<input id="f-time" type="number" min="0" value="${r.time||""}" placeholder="25"></label>
    </div>
    <label>Tags (comma-separated)<input id="f-tags" value="${esc((r.tags||[]).join(", "))}" placeholder="high-protein, quick"></label>
    <label>Ingredients — one per line, as “qty unit name”
      <textarea id="f-ings" placeholder="0.5 cup rolled oats&#10;2 eggs&#10;1 tbsp olive oil">${esc((r.ingredients||[]).map(ingToLine).join("\n"))}</textarea></label>
    <label>Steps — one per line
      <textarea id="f-steps">${esc((r.steps||[]).join("\n"))}</textarea></label>
    <button class="btn" id="f-save" style="width:100%;margin-top:8px">Save recipe</button>
  `);
  $("#f-save").onclick = ()=>{
    const name = $("#f-name").value.trim();
    if(!name){ toast("Name is required"); $("#f-name").focus(); return; }
    const data = {
      name, cat: $("#f-cat").value,
      cal: Math.max(0, Number($("#f-cal").value)||0),
      time: Math.max(0, Number($("#f-time").value)||0),
      tags: $("#f-tags").value.split(",").map(s=>s.trim()).filter(Boolean),
      ingredients: $("#f-ings").value.split("\n").map(parseIngLine).filter(Boolean),
      steps: $("#f-steps").value.split("\n").map(s=>s.trim()).filter(Boolean),
    };
    if(existing) Object.assign(existing, data);
    else state.recipes.push(Object.assign({id:uid()}, data));
    save(); closeModal(); render(); toast("Recipe saved");
  };
}

function inventoryModal(){
  openModal(`
    <h3>Add inventory item</h3>
    <label>Item name<input id="f-iname" placeholder="e.g. brown rice"></label>
    <div class="grid2">
      <label>Quantity<input id="f-iqty" type="number" min="0" step="0.25" value="1"></label>
      <label>Unit<select id="f-iunit">
        <option value="">count</option>
        ${["cup","tbsp","tsp","g","kg","ml","l","oz","lb","pc","can","clove","slice","bunch","head"]
          .map(u=>`<option>${u}</option>`).join("")}
      </select></label>
    </div>
    <button class="btn" id="f-isave" style="width:100%;margin-top:8px">Add to inventory</button>
  `);
  $("#f-isave").onclick = ()=>{
    const name = $("#f-iname").value.trim();
    if(!name){ toast("Name is required"); $("#f-iname").focus(); return; }
    const qty = Math.max(0, Number($("#f-iqty").value)||0);
    const unit = $("#f-iunit").value;
    const k = keyOf(name, unit);
    const existing = state.inventory.find(it=> keyOf(it.name,it.unit)===k);
    if(existing) existing.qty = round1(existing.qty + qty);
    else state.inventory.push({id:uid(), name, qty, unit});
    save(); closeModal(); render(); toast("Added to inventory");
  };
}

function extraModal(){
  openModal(`
    <h3>Add extra grocery item</h3>
    <p class="muted small" style="margin-top:0">Something you want to buy that isn’t part of a planned recipe.</p>
    <label>Item name<input id="f-ename" placeholder="e.g. sparkling water"></label>
    <div class="grid2">
      <label>Quantity<input id="f-eqty" type="number" min="0" step="0.25" value="1"></label>

        ${["cup","tbsp","tsp","g","kg","ml","l","oz","lb","pc","can","bunch","head"]
          .map(u=>`<option>${u}</option>`).join("")}
      </select></label>
    </div>
    <button class="btn" id="f-esave" style="width:100%;margin-top:8px">Add to list</button>
  `);

function pickerModal(date, meal){
  const draw = q =>{
    const query = (q||"").toLowerCase();
    const match = state.recipes.filter(r=> !query || r.name.toLowerCase().includes(query));
    const pref = match.filter(r=> r.cat===meal);
    const rest = match.filter(r=> r.cat!==meal);
    const rows = list => list.map(r=>`
      <div class="pickrow" data-choose="${r.id}">
        <div><div class="name">${esc(r.name)}</div>
          <div class="muted small">${r.cal} kcal · ${r.time} min</div></div>
        <span class="pill">${MEAL_LABEL[r.cat]}</span>
      </div>`).join("");
    return (pref.length?`<p class="muted small" style="margin:8px 0 2px">Suggested for ${MEAL_LABEL[meal].toLowerCase()}</p>`+rows(pref):"")
         + (rest.length?`<p class="muted small" style="margin:12px 0 2px">Other recipes</p>`+rows(rest):"")
         + (!match.length?`<p class="muted empty">No recipes match.</p>`:"");
  };
  openModal(`
    <h3>${MEAL_LABEL[meal]} · ${fmtDow(date)} ${fmtDate(date)}</h3>
    <input class="search" id="pickSearch" placeholder="Search recipes…">
    <div id="pickList">${draw("")}</div>
  `);
  const wirePicks = ()=> $$("[data-choose]").forEach(el=> el.onclick = ()=>{
    if(!state.plan[date]) state.plan[date] = {};
    state.plan[date][meal] = el.dataset.choose;
    save(); closeModal(); render(); toast("Meal planned");
  });
  wirePicks();
  $("#pickSearch").oninput = e=>{ $("#pickList").innerHTML = draw(e.target.value); wirePicks(); };
  $("#pickSearch").focus();
}

function settingsModal(){
  openModal(`
    <h3>Backup & data</h3>
    <p class="muted small">All data lives in this browser (localStorage). Export a JSON backup or restore one.</p>
    <div class="grid2">
      <button class="btn" id="exportBtn">⬇ Export JSON</button>
      <button class="btn subtle" id="importBtn">⬆ Import JSON</button>
    </div>
    <input type="file" id="importFile" accept="application/json" hidden>
    <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
    <button class="btn danger" id="resetBtn" style="width:100%">Reset all data</button>
  `);
  $("#exportBtn").onclick = ()=>{
    const blob = new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `nourishplan-${todayISO()}.json`;
    a.click(); URL.revokeObjectURL(a.href);
    toast("Exported");
  };
  $("#importBtn").onclick = ()=> $("#importFile").click();
  $("#importFile").onchange = e=>{
    const f = e.target.files[0]; if(!f) return;
    const rd = new FileReader();
    rd.onload = ()=>{
      try{
        const data = JSON.parse(rd.result);
        if(!confirm("Replace all current data with the imported file?")) return;
        state = normalize(data); save(); closeModal(); render(); toast("Imported");
      }catch(err){ toast("Invalid file"); }
    };
    rd.readAsText(f);
  };
  $("#resetBtn").onclick = ()=>{
    if(!confirm("Reset everything back to the example data?")) return;
    state = normalize(seed()); save(); closeModal(); render(); toast("Reset");
  };
}

/* ---------------- wiring ---------------- */
function wire(){
  $$("[data-tab]").forEach(b=> b.onclick = ()=>{ workspace=null; view=b.dataset.tab; render(); });
  $$("[data-open]").forEach(b=> b.onclick = e=>{ e.stopPropagation();
    workspace = {id:b.dataset.open}; render(); });
  $("#backBtn") && ($("#backBtn").onclick = ()=>{ workspace=null; render(); });
  $("#menuBtn") && ($("#menuBtn").onclick = settingsModal);

  /* planner */
  $$("[data-mode]").forEach(b=> b.onclick = ()=>{ plannerMode=b.dataset.mode; render(); });
  $$("[data-wk]").forEach(b=> b.onclick = ()=>{
    const v = Number(b.dataset.wk);
    weekOffset = v===0 ? 0 : weekOffset+v; render(); });
  $$("[data-daynav]").forEach(b=> b.onclick = ()=>{
    const v = Number(b.dataset.daynav);
    if(v===0){ dayDate = todayISO(); }
    else{ const d = new Date(dayDate+"T00:00:00"); d.setDate(d.getDate()+v); dayDate = isoOf(d); }
    render(); });
  $$("[data-pick]").forEach(b=> b.onclick = ()=>{
    const [d,m] = b.dataset.pick.split("|"); pickerModal(d,m); });
  $$("[data-clearslot]").forEach(b=> b.onclick = e=>{ e.stopPropagation();
    const [d,m] = b.dataset.clearslot.split("|");
    if(state.plan[d]){ state.plan[d][m] = null; }
    save(); render(); toast("Removed"); });

  /* recipes */
  const rs = $("#recipeSearch");
  if(rs){ rs.oninput = e=>{ recipeQuery = e.target.value;
    const scr = $(".screen"); scr.innerHTML = renderRecipes(); wire(); renderFab();
    const el = $("#recipeSearch"); el.focus(); el.setSelectionRange(el.value.length, el.value.length); }; }
  $$("[data-cat]").forEach(b=> b.onclick = ()=>{ recipeCat = b.dataset.cat; render(); });
  $("#editRecipeBtn") && ($("#editRecipeBtn").onclick = ()=> recipeModal(recipeById(workspace.id)));
  $("#delRecipeBtn") && ($("#delRecipeBtn").onclick = ()=>{
    const r = recipeById(workspace.id); if(!r) return;
    if(!confirm(`Delete “${r.name}”? It will also be removed from your plan.`)) return;
    state.recipes = state.recipes.filter(x=> x.id!==r.id);
    Object.keys(state.plan).forEach(d=> MEALS.forEach(m=>{
      if(state.plan[d][m]===r.id) state.plan[d][m]=null; }));
    workspace = null; save(); render(); toast("Recipe deleted");
  });

  /* inventory */
  const adj = (id,delta)=>{
    const it = state.inventory.find(x=> x.id===id); if(!it) return;
    it.qty = round1(Math.max(0, it.qty + delta));
    save(); render();
  };
  $$("[data-invplus]").forEach(b=> b.onclick = ()=> adj(b.dataset.invplus, +1));
  $$("[data-invminus]").forEach(b=> b.onclick = ()=> adj(b.dataset.invminus, -1));
  $$("[data-invdel]").forEach(b=> b.onclick = ()=>{
    state.inventory = state.inventory.filter(x=> x.id!==b.dataset.invdel);
    save(); render(); toast("Removed"); });

  /* grocery */
  $$("[data-chk]").forEach(cb=> cb.onchange = ()=>{
    const k = cb.dataset.chk;
    if(cb.checked) state.checked[k] = true; else delete state.checked[k];
    save(); render(); });
  $$("[data-extradel]").forEach(b=> b.onclick = e=>{ e.preventDefault(); e.stopPropagation();
    state.extras = state.extras.filter(x=> x.id!==b.dataset.extradel);
    delete state.checked["x:"+b.dataset.extradel];
    save(); render(); toast("Removed"); });
  $("#purchasedBtn") && ($("#purchasedBtn").onclick = ()=>{
    const {toBuy} = groceryData();
    let moved = 0;
    toBuy.filter(i=> state.checked[i.key]).forEach(i=>{
      const existing = state.inventory.find(it=> keyOf(it.name,it.unit)===i.key);
      if(existing) existing.qty = round1(existing.qty + i.buy);
      else state.inventory.push({id:uid(), name:i.name, qty:i.buy, unit:i.unit});
      delete state.checked[i.key]; moved++;
    });
    state.extras = state.extras.filter(e=>{
      if(!state.checked["x:"+e.id]) return true;
      const k = keyOf(e.name, e.unit);
      const existing = state.inventory.find(it=> keyOf(it.name,it.unit)===k);
      if(existing) existing.qty = round1(existing.qty + e.qty);
      else state.inventory.push({id:uid(), name:e.name, qty:e.qty, unit:e.unit});
      delete state.checked["x:"+e.id]; moved++;
      return false;
    });
    save(); render(); toast(`${moved} item${moved===1?"":"s"} moved to inventory`);
  });
}

render();
</script>
</body>
</html>
